<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>型通り他人 ／ もん【遊べるMV】スマホ版</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e12;--ink:#e8edf2;--dim:#7d8b99;--me:#3fa26a;--meT:#08160e;--you:#f2f5f7;--youT:#1a2028;--miss:#5a636d;--alert:#e2574c;
 --g0:#e6ebf0;--gA:#f4a3a3;--gB:#8fd0ff;--gC:#ffe28a;--gD:#b8f0a6;--gE:#a9c9ff;--gF:#7fe3d6;--gG:#ffb27a;--gI:#c9a6ff;--gT:#ff9fb0;--gS:#ffd98a;--gV:#d5ff8a;--gL:#cfd8e0;--gU:#9aa7b3;--gM:#bfe9ff;--gK:#ffc2c2;--gW:#d0d0d0;--gQ:#ffe0a0;--gX:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{position:relative;flex:none;width:1920px;height:1080px;transform-origin:center;background:var(--bg);overflow:hidden}
.bg{position:absolute;inset:-40px;background-size:cover;background-position:center;opacity:0;transition:opacity 1.8s,filter 2s;transform:scaleX(-1.02) scaleY(1.02)}
.bg.on{opacity:1}
#grade{position:absolute;inset:0;mix-blend-mode:soft-light;transition:background 2s;pointer-events:none}
#noise{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:overlay;opacity:.5}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 35% 55%,transparent 45%,rgba(0,0,0,.5) 100%);pointer-events:none}
#scan{position:absolute;inset:0;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 5px);mix-blend-mode:screen}

#left{position:absolute;left:0;top:0;width:680px;height:1080px}
#chara{position:absolute;left:50%;bottom:-40px;height:1000px;width:560px;transform:translateX(-50%);transition:filter .9s;transform-origin:50% 100%}
#chara img{position:absolute;left:50%;top:0;height:100%;transform:translateX(-50%);opacity:0;transition:opacity .7s}
#chara img.on{opacity:1}
#chara img.shake{animation:cshake .4s}
@keyframes cshake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(-53%)}75%{transform:translateX(-47%)}}

#top{position:absolute;left:0;top:0;width:1920px;height:76px;display:flex;align-items:center;padding:0 40px;z-index:5}
#title{font-weight:900;font-size:26px;letter-spacing:.04em}#title small{font-weight:500;color:var(--dim);font-size:15px;margin-left:12px;letter-spacing:.1em}
#meterbox{margin-left:auto;display:flex;align-items:center;gap:14px}
#meterlbl{font-size:15px;color:var(--dim);letter-spacing:.12em}
#meter{width:360px;height:10px;background:#1c232b;border-radius:5px;overflow:hidden}#meterfill{height:100%;width:0;background:#c9d3dc;transition:width .6s cubic-bezier(.2,.8,.2,1)}
#meterval{font-size:26px;font-weight:700;width:96px;text-align:right;font-variant-numeric:tabular-nums}
#combo{position:absolute;left:40px;top:96px;font-weight:900;font-size:54px;color:#fff;opacity:.9;font-variant-numeric:tabular-nums;z-index:5;text-shadow:0 2px 12px rgba(0,0,0,.6);transition:opacity 1s}
#combo small{font-size:18px;font-weight:500;color:var(--dim);margin-left:10px;letter-spacing:.14em}
#combo.pop{animation:cpop .18s}
@keyframes cpop{50%{transform:scale(1.12)}}

/* phone */
#phone{position:absolute;right:56px;top:104px;width:1160px;height:920px;background:rgba(16,20,26,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #26303a;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;z-index:4;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0px rgba(120,200,255,0);transition:filter .5s,box-shadow .8s}
#phone.mirror{animation:mir .9s ease-in-out}
@keyframes mir{0%{transform:scaleX(1)}30%{transform:scaleX(-1)}70%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
#phead{height:84px;display:flex;align-items:center;padding:0 30px;gap:18px;border-bottom:1px solid #26303a;background:rgba(26,32,40,.7)}
#avatar{width:48px;height:48px;border-radius:50%;background:#2a3540 center/cover;position:relative}
#avatar::after{content:"";position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:#57d08a;border:3px solid #1a2028;transition:background .6s}
#avatar.off::after{background:#5a636d}
#pname{font-size:24px;font-weight:700}#pstatus{font-size:15px;color:var(--dim);letter-spacing:.06em}
#clock{margin-left:auto;font-size:18px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.06em}
#body{flex:1;position:relative;min-height:0;overflow:hidden}
#chat{position:absolute;inset:0 0 96px 0;padding:24px 34px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;overflow:hidden}
#input{position:absolute;left:0;right:0;bottom:0;height:96px;border-top:1px solid #26303a;background:rgba(20,26,33,.8);display:flex;align-items:center;padding:0 30px;gap:16px}
#input .hint{flex:1;height:52px;border-radius:26px;background:#1c232b;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:16px;letter-spacing:.2em;gap:10px;transition:background .08s,color .08s}
#input .hint.on{background:#2c3a48;color:#fff}
#input .hint kbd{background:#0f1318;border:1px solid #2e3a46;border-radius:6px;padding:2px 10px;font-size:15px;color:#c8d2dc}
#lanes{position:absolute;inset:0 0 96px 0;pointer-events:none}
#judge{position:absolute;left:34px;right:34px;bottom:0;height:2px;background:rgba(255,255,255,.4)}
#judgeglow{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(0deg,rgba(255,255,255,.08),transparent);pointer-events:none}

/* bubbles */
.msg{max-width:88%;padding:12px 20px;font-size:27px;font-weight:500;line-height:1.35;position:relative;animation:in .25s ease-out;transition:opacity .45s,transform .45s,background .35s,color .35s;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--me);color:var(--meT);border-radius:20px 20px 4px 20px}
.msg.you{align-self:flex-start;background:var(--you);color:var(--youT);border-radius:20px 20px 20px 4px}
.msg .w{margin-right:.35em;display:inline-block}.msg .w:last-of-type{margin-right:0}
.msg.me .w{color:var(--meT)!important}
.msg.you .w{color:var(--youT)!important}
.msg .w.m{color:var(--miss)!important;text-decoration:line-through}
.msg.fail{background:#1c2229!important;border:1px solid #3a2b2b;color:var(--dim)!important}
.msg.fail .w{color:var(--dim)!important}
.msg .tag{display:block;font-size:14px;letter-spacing:.1em;margin-top:6px;text-align:right;color:var(--alert)}
.msg.you .tag{color:#7a8590;text-align:left}
.msg .tag.err::before{content:"!";display:inline-block;width:16px;height:16px;line-height:16px;border-radius:50%;background:var(--alert);color:#fff;font-size:11px;text-align:center;margin-right:6px;font-weight:900}
.sys{align-self:center;color:#8593a0;font-size:20px;letter-spacing:.14em;padding:6px 0;animation:in .25s ease-out;transition:opacity .45s,transform .45s}
.sys b{color:#fff;font-weight:900;font-size:30px;letter-spacing:.2em;margin:0 8px}
.gone{opacity:0;transform:translateY(-10px) scale(.96)}
.typing{align-self:flex-end;background:var(--me);color:var(--meT);border-radius:20px 20px 4px 20px;padding:12px 22px;font-size:22px;letter-spacing:.2em;animation:in .25s}
@keyframes in{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}

/* notes */
.note{position:absolute;left:0;top:0;transform:translate(-50%,-50%);padding:8px 18px;border-radius:26px;font-size:26px;font-weight:700;white-space:nowrap;background:#161c23;border:2px solid var(--g0);color:var(--g0);box-shadow:0 6px 22px rgba(0,0,0,.6);will-change:transform;letter-spacing:.02em}
.note.big{font-size:32px;padding:10px 24px;border-width:3px;background:#fff;color:#111!important;border-color:#fff}
.note.hit{animation:pop .3s ease-out forwards}.note.miss{border-color:var(--miss)!important;color:var(--miss)!important;background:transparent!important;box-shadow:none!important;animation:drop .5s ease-in forwards}
@keyframes pop{100%{opacity:0;scale:1.5}}
@keyframes drop{100%{opacity:0;translate:0 40px}}
.jt{position:absolute;transform:translate(-50%,-50%);font-size:20px;font-weight:700;letter-spacing:.14em;pointer-events:none;animation:jt .5s ease-out forwards}
@keyframes jt{100%{opacity:0;transform:translate(-50%,-120%)}}

/* ===== effect vocabulary (fx-*) — applies to falling notes and landed words ===== */
.fx-wobble{animation:wob 1.1s ease-in-out infinite}@keyframes wob{0%,100%{rotate:-3deg}50%{rotate:3deg}}
.fx-vibrate{animation:vib .09s linear infinite}@keyframes vib{0%{translate:0 0}25%{translate:2px -1px}50%{translate:-2px 1px}75%{translate:1px 2px}100%{translate:0 0}}
.fx-glitch{animation:gl .5s steps(2) infinite}@keyframes gl{0%{text-shadow:2px 0 #f0f,-2px 0 #0ff}50%{text-shadow:-2px 0 #f0f,2px 0 #0ff}100%{text-shadow:none}}
.fx-cold{letter-spacing:.22em;font-weight:900}
.fx-freeze{letter-spacing:.14em;color:#bfe9ff!important;text-shadow:0 0 8px rgba(160,220,255,.7);animation:frz .6s steps(1) 1}@keyframes frz{0%{filter:none}50%{filter:brightness(2)}}
.fx-mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em}
.fx-crack{animation:crack .7s steps(3) infinite}@keyframes crack{0%{clip-path:inset(0)}33%{clip-path:polygon(0 0,100% 0,100% 45%,55% 48%,100% 52%,100% 100%,0 100%,0 55%,45% 52%,0 48%)}66%{clip-path:inset(0)}}
.fx-drip{animation:drip 1.6s ease-in-out infinite}@keyframes drip{0%,100%{filter:blur(0)}50%{filter:blur(1.4px);translate:0 3px}}
.fx-tilt{rotate:-5deg}
.fx-hollow{-webkit-text-stroke:1.5px currentColor;color:transparent!important}
.note.fx-hollow{color:transparent!important;-webkit-text-stroke:1.5px #fff}
.fx-bold{font-weight:900;font-size:1.15em}
.fx-jitter{animation:jit .35s ease-in-out infinite}@keyframes jit{0%,100%{scale:1}50%{scale:1.08}}
.fx-twinkle{animation:twk 1.2s ease-in-out infinite}@keyframes twk{0%,100%{filter:brightness(1)}50%{filter:brightness(1.6) drop-shadow(0 0 6px #fff)}}
.fx-stretch{transform-origin:left;animation:str 1.4s ease-in-out infinite;letter-spacing:.12em}@keyframes str{0%,100%{scale:1 1}50%{scale:1.18 1}}
.fx-squash{animation:sq .5s ease-out both}@keyframes sq{0%{scale:1 1}60%{scale:1.25 .45}100%{scale:1.1 .7}}
.fx-fadeslow{animation:fdl 3.5s ease-in 1s forwards}@keyframes fdl{100%{opacity:.25}}
.fx-cage{outline:2px solid currentColor;outline-offset:2px;padding:0 4px;animation:cage .4s steps(2) 3}@keyframes cage{50%{outline-offset:-2px}}
.fx-float{animation:flt 1.6s ease-in-out infinite}@keyframes flt{0%,100%{translate:0 0}50%{translate:0 -8px}}
.fx-vanish{animation:vsh 1s ease-in .7s forwards}@keyframes vsh{100%{opacity:0;filter:blur(6px)}}
.fx-flee{animation:flee 1.2s ease-in .6s forwards}@keyframes flee{100%{opacity:0;translate:180px 0}}
.fx-strike{text-decoration:line-through;text-decoration-thickness:3px}
.fx-gray{color:#8a949e!important;filter:grayscale(1)}
.fx-flicker{animation:flk .12s steps(1) infinite}@keyframes flk{0%{opacity:1}30%{opacity:.2}60%{opacity:.9}80%{opacity:.3}100%{opacity:1}}
.fx-blink{animation:blk .9s steps(1) 2}@keyframes blk{40%{opacity:0}60%{opacity:1}}
.fx-shrink{font-size:.72em;opacity:.8}
.fx-sink{animation:snk 1.2s ease-out forwards}@keyframes snk{100%{translate:0 10px;opacity:.55}}
.fx-deep{animation:dp 2s ease-in forwards}@keyframes dp{100%{translate:0 22px;opacity:.3;filter:blur(1px)}}
.fx-hang{transform-origin:top center;animation:hng 1.5s ease-in-out infinite}@keyframes hng{0%,100%{rotate:-8deg}50%{rotate:8deg}}
.fx-rise{animation:rse .9s ease-out both}@keyframes rse{0%{translate:0 14px;opacity:.4}100%{translate:0 -4px}}
.fx-gasp{animation:gsp .22s ease-in-out infinite}@keyframes gsp{0%,100%{scale:1 1}50%{scale:1.04 .94}}
.fx-cutoff{clip-path:inset(0 22% 0 0)}
.fx-error{color:#ff5a5a!important;text-decoration:underline wavy #ff5a5a;font-family:ui-monospace,monospace}
.fx-coupon{outline:2px dashed currentColor;outline-offset:3px;padding:0 6px}
.fx-grow1{font-size:1.15em;font-weight:900}.fx-grow2{font-size:1.35em;font-weight:900}.fx-grow3{font-size:1.6em;font-weight:900}.fx-grow4{font-size:1.9em;font-weight:900;animation:vib .08s linear infinite}
.fx-inflate{animation:infl .8s ease-out both}@keyframes infl{0%{scale:.6}60%{scale:1.35}100%{scale:1.2}}
.fx-tailfade{-webkit-mask-image:linear-gradient(90deg,#000 55%,transparent);mask-image:linear-gradient(90deg,#000 55%,transparent)}
.fx-recoil{animation:rcl .5s ease-out both}@keyframes rcl{0%{translate:0 0}40%{translate:-26px 0}100%{translate:-8px 0}}
.fx-creep{animation:crp 1.6s ease-out both}@keyframes crp{0%{translate:-60px 0;opacity:0}100%{translate:0 0;opacity:1}}
.fx-burn{animation:brn 1.8s ease-in forwards}@keyframes brn{0%{color:#ffb27a;text-shadow:0 0 8px #ff7a2a}60%{color:#ff4d1a;text-shadow:0 -6px 14px #ff2a00}100%{color:#333!important;opacity:.3;text-shadow:none;filter:blur(1px)}}
.fx-drown{color:#8fd0ff!important;animation:drw 2.2s ease-in forwards}@keyframes drw{100%{translate:0 26px;opacity:.25;filter:blur(2px)}}
.fx-red{color:#ff6b6b!important}
.fx-typewriter .w{animation:rev .05s linear both}
.msg .w.reveal{animation:rev .05s linear both}@keyframes rev{0%{opacity:0}100%{opacity:1}}
.msg.fx-wobble,.msg.fx-vibrate,.msg.fx-glitch,.msg.fx-drip,.msg.fx-crack,.msg.fx-twinkle,.msg.fx-jitter,.msg.fx-stretch,.msg.fx-float,.msg.fx-hang,.msg.fx-gasp,.msg.fx-flicker{animation-iteration-count:4}
/* per-char */
.ch{display:inline-block}
.ch.wave{animation:wv .9s ease-in-out infinite}@keyframes wv{0%,100%{translate:0 0}50%{translate:0 -7px}}
.ch.shatter{animation:sht 1.2s ease-in .5s forwards}@keyframes sht{100%{opacity:0;translate:var(--dx) var(--dy);rotate:var(--r)}}
.ch.crumble{animation:crm 1.4s ease-in .4s forwards}@keyframes crm{100%{opacity:0;translate:0 40px;rotate:var(--r)}}
.ch.peel{animation:pl 1.2s ease-in .5s forwards}@keyframes pl{100%{opacity:0;translate:0 -18px;rotate:-25deg}}
.ch.zero{animation:zr .55s steps(1) both}@keyframes zr{0%{opacity:0}100%{opacity:1}}
/* bubble-level */
.msg.tear{animation:tr .8s steps(4) 1 .3s forwards}@keyframes tr{50%{clip-path:polygon(0 0,52% 0,48% 100%,0 100%)}75%{clip-path:polygon(0 0,50% 0,50% 100%,0 100%)}100%{clip-path:polygon(0 0,49% 0,47% 100%,0 100%)}}
.msg.bend{animation:bnd 1.2s ease-in-out 2}@keyframes bnd{0%,100%{rotate:0}50%{rotate:-9deg;translate:0 6px}}
.msg.overshoot{animation:ovs .9s cubic-bezier(.2,1.6,.4,1) both}@keyframes ovs{0%{rotate:0}60%{rotate:22deg}100%{rotate:12deg}}
.msg.toss{animation:tss 1s ease-in .6s forwards}@keyframes tss{100%{opacity:0;translate:120px -160px;rotate:40deg}}
.msg.cooldown{animation:cdn 2.5s ease-in-out forwards}@keyframes cdn{0%{background:#ff6a3a;color:#fff}100%{background:#bfe9ff;color:#1a2028}}
.stamp{position:absolute;right:-14px;top:-18px;padding:4px 12px;border:3px solid #ff4d4d;color:#ff4d4d;font-weight:900;font-size:22px;letter-spacing:.14em;rotate:-14deg;border-radius:6px;background:rgba(255,255,255,.85);animation:stp .35s cubic-bezier(.3,1.5,.5,1) both}
@keyframes stp{0%{scale:2.5;opacity:0}100%{scale:1;opacity:1}}
.tick{position:absolute;right:8px;bottom:-22px;font-size:16px;color:#57d08a;font-weight:700;animation:in .3s}
.readmark{position:absolute;left:-52px;bottom:2px;font-size:14px;color:#8a949e;animation:in .4s}
.banner{position:absolute;left:50%;top:14px;translate:-50% 0;background:rgba(240,244,248,.96);color:#1a2028;padding:12px 22px;border-radius:14px;font-size:18px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:bnr .35s cubic-bezier(.2,1.4,.4,1) both;z-index:6}
.banner b{width:28px;height:28px;border-radius:50%;background:var(--alert);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900}
@keyframes bnr{0%{translate:-50% -80px;opacity:0}100%{translate:-50% 0;opacity:1}}
#phone.flip{animation:flp 1.1s ease-in-out}@keyframes flp{30%{rotate:180deg}70%{rotate:180deg}}
#phone.creak{animation:crk .5s ease-in-out}@keyframes crk{25%{rotate:-1.2deg}75%{rotate:1.2deg}}
#curtain{position:absolute;inset:0;background:#000;transform:translateY(-100%);transition:transform .5s ease-in;z-index:8;pointer-events:none}
#film{position:absolute;inset:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);background:rgba(200,220,240,.08);opacity:0;transition:opacity .5s;z-index:7;pointer-events:none}
#crackov{position:absolute;inset:0;opacity:0;transition:opacity .2s;z-index:7;pointer-events:none;background:
 linear-gradient(115deg,transparent 49.6%,rgba(255,255,255,.7) 50%,transparent 50.5%),linear-gradient(35deg,transparent 49.6%,rgba(255,255,255,.55) 50%,transparent 50.5%),linear-gradient(160deg,transparent 49.7%,rgba(255,255,255,.5) 50%,transparent 50.4%),linear-gradient(80deg,transparent 49.7%,rgba(255,255,255,.45) 50%,transparent 50.4%)}
#slash{position:absolute;inset:0;pointer-events:none;z-index:16;opacity:0;background:linear-gradient(120deg,transparent 49%,#fff 49.6%,#fff 50.4%,transparent 51%)}
#bokeh{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bk{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,220,160,.7),rgba(255,200,120,0) 70%);animation:bkf var(--d) linear forwards}
@keyframes bkf{0%{opacity:0;translate:0 40px}20%{opacity:1}100%{opacity:0;translate:0 -140px}}
.walker{position:absolute;bottom:0;width:120px;height:520px;background:#000;border-radius:60px 60px 0 0;opacity:.85;animation:wlk var(--d) linear forwards;filter:blur(1px)}
@keyframes wlk{0%{translate:-200px 0}100%{translate:2100px 0}}
#callov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(10,14,18,.85);z-index:9;color:#fff;font-size:26px;letter-spacing:.14em}
#callov .ic{width:90px;height:90px;border-radius:50%;background:#57d08a;display:flex;align-items:center;justify-content:center;font-size:44px;animation:rng .4s ease-in-out infinite}
@keyframes rng{0%,100%{rotate:-12deg}50%{rotate:12deg}}
#callov.no .ic{background:var(--alert);animation:none}

/* ===== v4 note styles ===== */
.nw{position:absolute;left:0;top:0;will-change:transform}
.note{position:relative;left:auto;top:auto;transform:none;font-size:30px}
.note.st-pill{}
.note.st-square{border-radius:6px}
.note.st-torn{border-radius:4px;clip-path:polygon(0 8%,6% 0,20% 5%,35% 0,50% 6%,65% 0,80% 5%,94% 0,100% 10%,97% 40%,100% 70%,96% 100%,80% 94%,60% 100%,40% 95%,20% 100%,5% 94%,0 70%,3% 40%)}
.note.st-coupon{border-style:dashed;border-radius:8px;background:#1a1f26}
.note.st-outline{background:transparent;color:transparent!important;-webkit-text-stroke:1.6px #fff;border-width:1px;border-color:#fff!important}
.note.st-white{background:#fff;color:#111!important;border-color:#fff}
.note.st-alert{background:#3a1416;border-color:#ff5a5a;color:#ff8a8a!important;box-shadow:0 0 22px rgba(255,80,80,.5)}
.note.st-term{font-family:ui-monospace,Menlo,Consolas,monospace;background:#061008;border-color:#57d08a;color:#8ff0b0!important;border-radius:4px;letter-spacing:.08em}
.note.st-hand{border-radius:60% 40% 55% 45%/50% 60% 40% 50%;rotate:-4deg;font-weight:500}
.note.st-big{font-size:40px;padding:12px 28px;border-width:3px;font-weight:900}
.note.st-small{font-size:22px;padding:5px 12px;opacity:.85}

function motion(n,p,W,H){ // returns [x,y,rot,scale,opacity]
 const bx=LANE_X[n.l]*W, y0=-30, y1=H, ly=y0+(y1-y0)*p; let x=bx,y=ly,r=0,sc=1,op=1;

  case 'spiral': r=p*360; x+=Math.sin(p*Math.PI*4)*30; sc=.7+p*.3; break;
  case 'swing': r=Math.sin(p*Math.PI*3)*20; break;
  case 'tumble': r=p*720; break;

  case 'shrinkin': sc=1.8-p*.85; op=.7+p*.3; break;
  case 'bounce': {const q=Math.abs(Math.sin(p*Math.PI*3))*(1-p)*70; y=ly-q;} break;

  case 'driftR': x=bx+(1-p)*(1-p)*260; break;
  case 'slam': {const e=p<.65?p*.25:.1625+Math.pow((p-.65)/.35,2.4)*.8375; y=y0+(y1-y0)*e; sc=p<.65?1:1+(p-.65)*.3;} break;

  case 'stagger': y=y0+(y1-y0)*(Math.floor(p*9)/9+ (p%(1/9))*0.4); break;
  case 'flicker': op=(Math.floor(p*30)%3===0)?.45:1; break;
  case 'shake': x+=(Math.random()-.5)*10; y+= (Math.random()-.5)*6; break;
  case 'wave': r=Math.sin(p*Math.PI*6)*8; x+=Math.sin(p*Math.PI*6)*12; break;
  case 'pendulum': r=Math.sin(p*Math.PI*2.5)*28; x+=Math.sin(p*Math.PI*2.5)*40; break;
  case 'rise': y=y1-(y1-y0)*(1-p)*0+ (y0-y1)*0; y=y1+(y0-y1)*(1-p); op=.3+p*.7; sc=.8+p*.2; break;
  case 'skid': x=bx+(1-p)*(1-p)*(n.l?-380:380); r=(1-p)*-12; break;

 bend:()=>phoneFx('bend',1200),
 redeyes:()=>{const e=document.createElement('div');e.className='eyes';stage.appendChild(e);setTimeout(()=>e.remove(),1700);},
 snow:()=>REACT.snowfall(),
 spit:()=>{stageFx('creak',500);REACT.lines(null,SW/2,SH/2);},
 tossphone:()=>phoneFx('toss',1300),
 mute:()=>{const t=$('tint');t.style.background='#000';t.style.transition='none';t.style.opacity=.0;banner('🔇 通知をミュートしました');},
};
function runBig(n){if(!n.B)return;const [id,arg]=n.B.split(':');if(BIGFX[id])BIGFX[id](n,arg);}
// ---------- v6 camera ----------
function applyCam(t){const li=lineAt(t);const n=notes.find(x=>x.line===li-1);const c=(n&&n.cam)||[1,0,0,1];const [sc,dx,dy,op]=c;
 const ch=$('chara');ch.style.transformOrigin='50% 100%';ch.style.opacity=op;
 ch.style.transform=`translateX(calc(-50% + ${dx}px)) translateY(${dy}px) scale(${sc}) ${(t>=136.7&&t<156)?'scaleX(-1)':''}`;}

// ---------- noise ----------
const nz=$('noise').getContext('2d');function drawNoise(){const a=0.05+events*0.012;const im=nz.createImageData(240,135),d=im.data;for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=a*255;}nz.putImageData(im,0,0);}

// ---------- outro / end ----------
function outro(){outroStarted=true;$('combo').style.opacity=0;const kids=[...chat.children];const span=(songDur-1.5)-now();const gap=Math.max(.35,Math.min(1.2,span/(kids.length+1)));
 kids.forEach((k,i)=>setTimeout(()=>{k.classList.add('gone');SFX.del();setTimeout(()=>k.remove(),450);},i*gap*1000));
 setTimeout(()=>{$('pstatus').textContent='';$('pname').textContent='';$('avatar').style.opacity=0;},kids.length*gap*1000+600);}
function finish(){if(ended)return;ended=true;$('end').classList.remove('hide');}

// ---------- loop ----------
let fr=0;
function loop(){const t=playing?now():songDur;if(!playing&&!ended){finish();return;}
 setBg(t<68.4?'room':t<136.6?'street':t<168.4?'mirror':'room');
 if(Math.floor(t*4)!==loop.q){loop.q=Math.floor(t*4);setChara();setMeter();}
 if((fr++&1)===0)drawNoise();
 // beat pulse
 while(lastBeat+1<BEATS.length&&BEATS[lastBeat+1]<=t){lastBeat++;if(lastBeat%2===0){const im=$('chara').querySelector('img.on');if(im){im.style.transition='transform .09s';im.style.transform='translateX(-50%) scaleY(1.012)';setTimeout(()=>{im.style.transition='transform .3s';im.style.transform='translateX(-50%)';},90);}}}
 const W=lanes.clientWidth,H=lanes.clientHeight;
 while(nextIdx<notes.length&&notes[nextIdx].t-t<=CFG.approach){spawn(notes[nextIdx]);nextIdx++;}
 for(const n of notes){if(!n.el||n.st)continue;place(n,t,W,H);
  if(auto){if(t>=n.t&&!CFG.autoMiss.includes(n.i))judge(n,'perfect');}
  if(t>n.t+0.17&&!n.st)judge(n,'miss');}
 if(!outroStarted&&t>notes[notes.length-1].t+2.4)outro();
 if(t>=songDur-0.3)finish();
 requestAnimationFrame(loop);}

// ---------- start ----------
async function startSong(){try{au.currentTime=CFG.startAt;}catch(e){}await au.play();tBase=CFG.startAt;pBase=performance.now();playing=true;au.addEventListener('ended',()=>{playing=false;},{once:true});}
function showError(m){const st=$('start');st.classList.remove('hide');$('cd').classList.add('hide');const p=st.querySelector('p');p.textContent=m;p.style.color='var(--alert)';}
async function begin(isAuto){if(started)return;started=true;auto=isAuto;ac();$('start').classList.add('hide');if(!au.src)setSongSrc(CFG.song);
 const cd=$('cd');cd.classList.remove('hide');$('count').textContent='…';
 await Promise.all([loadImg(I.N,CFG.img.normal),loadImg(I.P,CFG.img.pose),loadImg(I.S,CFG.img.smile),loadImg(I.C,CFG.img.cry),loadImg(I.F,CFG.img.noface),loadImg(I.G,CFG.img.gray),loadImg(I.Z,CFG.img.sil),loadImg($('endimg'),CFG.img.end)]);
 if(I.N.dataset.missing)I.N.style.display='none'; I.N.classList.add('on');setBg('room');$('avatar').style.backgroundImage=`url(${CFG.img.normal})`;
 const t0=performance.now();while(!songReady&&!au.error&&performance.now()-t0<8000){await new Promise(r=>setTimeout(r,100));}
 if(!songReady){started=false;showError('song.mp3 を読み込めませんでした。下の「mp3を選ぶ」で曲ファイルを指定してください。');return;}
 try{await au.play();au.pause();}catch(e){started=false;showError('再生を開始できませんでした：'+e.name+'。「mp3を選ぶ」で指定してからもう一度押してください。');return;}
 if(auto)document.body.style.cursor='none';
 for(let i=3;i>0;i--){$('count').textContent=i;await new Promise(r=>setTimeout(r,800));}
 cd.classList.add('hide');try{await startSong();}catch(e){started=false;showError('再生エラー：'+e.name);return;}
 notes.forEach(n=>{if(n.t<CFG.startAt-0.2){n.st=1;if(n.fx.includes('X'))events++;}});while(nextIdx<notes.length&&notes[nextIdx].t<CFG.startAt-0.2)nextIdx++;
 while(lastBeat+1<BEATS.length&&BEATS[lastBeat+1]<CFG.startAt)lastBeat++;
 setChara();setPhoneLight();requestAnimationFrame(loop);}
if(MOBILE){$('hL').innerHTML='← 左タップ　戻ってくる';$('hR').innerHTML='送信　右タップ →';}
$('btnPlay').onclick=()=>begin(false);$('btnAuto').onclick=()=>begin(true);
$('pick').onchange=e=>{const f=e.target.files[0];if(!f)return;setSongSrc(URL.createObjectURL(f));const p=$('start').querySelector('p');p.textContent=f.name+' を読み込みました。「遊ぶ」か「オート再生」を押してください。';p.style.color='';};
</script></body></html>
